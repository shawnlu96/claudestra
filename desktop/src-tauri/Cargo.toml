[package]
name = "claudestra-desktop"
version = "0.1.0"
description = "Claudestra menu-bar app (experimental)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
