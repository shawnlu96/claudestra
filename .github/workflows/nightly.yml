name: Nightly slow tests

# 慢清单（tests/slow-tests.txt）里的测试文件每晚跑一遍（merge-arch-CISHARD1）：PR / push main 的 CI 分片不跑它们
# （scripts/ci-test-shard.ts），所以这里是它们唯一会跑的地方。和 CI 是两个 workflow：不是任何 PR 的检查、不进 requiredChecks、
# 不产出 ci-proof 工件，红了只在 Actions 里看得到，不影响合并。
on:
  schedule:
    # 每天 UTC 18:00
    - cron: "0 18 * * *"
  workflow_dispatch:

# 自己的并发组，不和 CI（`CI-<PR 号 / ref>`）共用：夜间运行不会挤掉排队中的 main CI，反过来也一样。
concurrency:
  group: nightly-slow-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slow:
    name: nightly slow tests ${{ matrix.part }} of 2
    runs-on: ubuntu-latest
    # 两片预计各 8 ~ 10 分钟（scripts/ci-test-shard.ts plan），挂住的测试最多占 runner 这么久
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      # 环境与 ci.yml 的分片作业一致：完整历史、同一 Bun 版本、web 依赖、tmux
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 与 CI 分片同一个 key，只取不存（存由 CI 分片做）
      - uses: actions/cache/restore@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install web dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: web

      - name: Install tmux
        run: |
          command -v tmux || sudo apt-get install -y -qq tmux || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }

      # 只跑慢清单：清单先落文件，分片脚本失败（清单里有不存在 / 重复的文件）或清单为空时这一步就失败，不会空着参数跑全部。
      - name: Slow tests
        shell: bash
        run: |
          bun run --silent test:shard slow ${{ matrix.part }}/2 > "$RUNNER_TEMP/files.txt"
          mapfile -t files < "$RUNNER_TEMP/files.txt"
          [ "${#files[@]}" -gt 0 ]
          bun test "${files[@]}"
