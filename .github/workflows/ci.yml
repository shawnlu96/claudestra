name: CI

# 在此之前仓库没有任何 CI：315 个测试没人跑，两万余行 src/ 没有静态类型检查
# （CONTRIBUTING 里推荐的 `bun build` 实测并不做类型检查）。2026-07-25 一次
# 方向性错误的改动 test 全绿、build 全过地走到了提交前一刻，只靠人工实测才拦下。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck + test + guard
    runs-on: ubuntu-latest
    steps:
      # guard 要拿推送前的 baseline 比对（放宽必须有 raised[] 记录），需要完整历史
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      # 防腐棘轮（scripts/guard）：超 baseline 即红；baseline 变大、改闸门本身都必须在 raised[] 写理由。
      # 比较基准：PR 取 base.sha，push 取推送前的 before（新分支首推是全 0 / force push 取不到时，
      # guard 回退到与 origin/main 的分叉点，再不行用 HEAD~1）。
      # GUARD_STRICT：CI 是最后一道闸，knip / oxc-parser 缺席导致规则被跳过也算失败（本地才降级）。
      # 这一步和 GUARD_STRICT 由 guard 自己校验（scripts/guard/self.ts），删掉或改名会让 guard 失败。
      - name: Guard (ratchets)
        run: bun run guard
        env:
          GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GUARD_STRICT: "1"

      # 各可执行入口都要能打包 —— 能抓到类型检查覆盖不到的模块解析/导入错误
      - name: Build entrypoints
        run: |
          for entry in bridge channel-server manager launcher cron setup; do
            echo "── building src/$entry.ts"
            bun build "src/$entry.ts" --target=bun --outdir=/tmp/ci-build
          done

  web:
    name: web typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 类型检查和 lint 用不到 sqlite / sharp 这类原生模块的安装脚本
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # lib/build-info.ts 由构建时生成（不入库），tsc 需要它先存在
      - name: Generate build info
        run: node scripts/gen-build-info.mjs

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit --incremental false

      # warning 数当棘轮用：只许降，降了就把这个数字改小
      - name: Lint (eslint)
        run: npx eslint --max-warnings 38
