name: CI

# 在此之前仓库没有任何 CI：315 个测试没人跑，两万余行 src/ 没有静态类型检查
# （CONTRIBUTING 里推荐的 `bun build` 实测并不做类型检查）。2026-07-25 一次
# 方向性错误的改动 test 全绿、build 全过地走到了提交前一刻，只靠人工实测才拦下。
on:
  push:
    branches: [main]
  pull_request:

# 同一 PR 的新 head 取消旧运行；不同 PR / main / 列车临时 PR 各自分组，互不取消。
# 仅 pull_request 事件取消，main push 不会被取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 单元测试拆成 4 片并行（单片串行要 14 分钟左右）。scripts/ci-test-shard.ts 按耗时把测试文件分片，各片在同一 head、
  # 同一 Bun 上跑同一份分法；片内照旧串行，每片一台独立 runner（临时状态天然隔离）。typecheck、guard、打包只在第 1 片跑。
  # 这些分片不是合并闸——必需检查是下面的 `typecheck + test + guard` 汇总作业。
  tests:
    name: test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # 一片红不取消其它片：每片的失败都看得到
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # guard 要拿推送前的 baseline 比对（放宽必须有 raised[] 记录），需要完整历史；有 6 个测试 `git show` 固定的历史提交，
      # 所以各片也不能浅克隆
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与线上一致的 Bun 版本：parseDotenv 等测试按 Bun 的真实行为校准，latest 一变 CI 就随机变红
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 根目录 tests/ 会 import web 的纯逻辑，其中几个（BFF 包装器的测试）顺带引用了 next /
      # better-sqlite3 的类型——web 依赖不装，typecheck 和 bun test 都找不到它们。
      # 本地因为 web/node_modules 一直在，所以这个缺口只在 CI 暴露（2026-09-23 首次推送即红）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 只查真正有意义的不同步：package.json 的依赖声明与锁文件根节点记的不一致（加了依赖没更新锁）。
      # 不比锁文件逐字——不同版本的 npm 排法本来就不一样（main 自己的锁在 CI 的 npm 10 下也会被重排），比了只剩噪音。
      - name: Web lockfile in sync with package.json (warning only)
        if: matrix.shard == 1
        run: >-
          node -e "const p=require('./web/package.json'),l=require('./web/package-lock.json').packages[''];
          const k=(o)=>JSON.stringify(Object.entries(o||{}).sort());
          if(k(p.dependencies)!==k(l.dependencies)||k(p.devDependencies)!==k(l.devDependencies))
          console.log('::warning file=web/package-lock.json::web/package.json 的依赖与锁文件不一致（改了依赖没更新锁文件）——在 web/ 下执行 npm install --package-lock-only 后提交')"

      # node_modules 按锁文件缓存，之后照样 npm install（缓存只省下载解包；锁文件一变 key 就变）
      - uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # 用 npm install 而不是 npm ci：用户装网页走的就是 npm install（setup / update）；npm ci 会因为贡献者本机
      # npm 版本不同、重排了锁文件而整个作业失败（#29 / #31 实遇，代码一行没错）。
      - name: Install web dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: web

      - name: Typecheck (tsc --noEmit)
        if: matrix.shard == 1
        run: bun run typecheck

      # tests/sandbox-isolation.test.ts 要经真 tmux 建沙箱 agent；CI 里缺 tmux 时它会直接失败（不静默跳过）。
      # 先不 apt-get update（占这一步的大头），装不上再 update 重装
      - name: Install tmux
        run: |
          command -v tmux || sudo apt-get install -y -qq tmux || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }

      # 日志另存一份给汇总作业核对：开头记 head 和 bun 自己发现的测试文件总数（--shard=99999/99999 一个文件都不跑），
      # 之后 Bun 在 Actions 里给每个跑过的文件打一行 `::group::<路径>:`。shell: bash 带 -o pipefail，tee 吞不掉退出码。
      - name: Unit tests (shard ${{ matrix.shard }}/4)
        shell: bash
        run: |
          bun run --silent test:shard ${{ matrix.shard }}/4 > "$RUNNER_TEMP/files.txt"
          mapfile -t files < "$RUNNER_TEMP/files.txt"
          discovered=$(bun test --shard=99999/99999 2>&1 | sed -n 's|.*: running 0/\([0-9]*\) test files.*|\1|p')
          printf 'head=%s\ndiscovered=%s\n' "$(git rev-parse HEAD)" "$discovered" > "$RUNNER_TEMP/shard.log"
          bun test "${files[@]}" 2>&1 | tee -a "$RUNNER_TEMP/shard.log"

      - uses: actions/upload-artifact@v4
        with:
          name: test-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard.log
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      # 防腐棘轮（scripts/guard）：超 baseline 即红；baseline 变大、改闸门本身都必须在 raised[] 写理由。
      # 比较基准：PR 取 base.sha，push 取推送前的 before（新分支首推是全 0 / force push 取不到时，
      # guard 回退到与 origin/main 的分叉点，再不行用 HEAD~1）。
      # GUARD_STRICT：CI 是最后一道闸，knip / oxc-parser 缺席导致规则被跳过也算失败（本地才降级）。
      # 这一步和 GUARD_STRICT 由 guard 自己校验（scripts/guard/self.ts），删掉或改名会让 guard 失败。
      - name: Guard (ratchets)
        if: matrix.shard == 1
        run: bun run guard
        env:
          GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GUARD_STRICT: "1"

      # 各可执行入口都要能打包 —— 能抓到类型检查覆盖不到的模块解析/导入错误
      - name: Build entrypoints
        if: matrix.shard == 1
        run: |
          for entry in bridge channel-server manager launcher cron setup relay scheduler; do
            echo "── building src/$entry.ts"
            bun build "src/$entry.ts" --target=bun --outdir=/tmp/ci-build
          done

  # 合并闸（必需检查，名字不能改）：4 片全部成功、且合起来恰好覆盖全部测试文件才绿。
  # if: always()——分片失败 / 取消 / 被跳过时这里照样跑并且变红；不加的话它会跟着被跳过，
  # 而被跳过的必需检查在 GitHub 上算通过。
  check:
    name: typecheck + test + guard
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      # 这一行的措辞是调度器 CI 自动重跑认的固定结论（src/lib/scheduler-merge-ci-rerun-log.ts GATE_VERDICT），改了要一起改
      - name: All shards succeeded
        run: |
          [ "${{ needs.tests.result }}" = success ] || { echo "::error::分片没有全部成功：${{ needs.tests.result }}"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: test-shard-*
          path: shards

      # 不漏不重：各片同一 head、同一 Bun；bun 自己发现的总数 = 入库测试文件数（发现规则一致）；各片 `::group::` 文件行
      # 合起来恰好等于入库的测试文件，没有一个文件被两片跑。Bun 改了输出格式会让这里整体对不上而变红，不会静默放行。
      - name: Shards cover every test file exactly once
        shell: bash
        run: |
          fail() { echo "::error::$*"; exit 1; }
          logs=(shards/*/shard.log)
          [ -f "${logs[0]}" ] || fail "没有下载到任何分片日志"
          heads=$(sed -n 's/^head=//p' "${logs[@]}" | sort -u)
          [ "$heads" = "$GITHUB_SHA" ] || fail "各片应都跑在 $GITHUB_SHA 上，实际：$heads"
          bunv=$(grep -h '^bun test v' "${logs[@]}" | sort -u)
          [ "$(wc -l <<<"$bunv")" -eq 1 ] || fail "各片 Bun 版本不一致：$bunv"
          git ls-files | grep -E '(\.|_)(test|spec)\.(c|m)?[jt]sx?$' | LC_ALL=C sort > "$RUNNER_TEMP/expected.txt"
          want=$(grep -c "" "$RUNNER_TEMP/expected.txt")
          disc=$(sed -n 's/^discovered=//p' "${logs[@]}" | sort -u)
          [ "$disc" = "$want" ] || fail "bun 自己发现的测试文件数（$disc）与入库清单（$want）对不上：发现规则不一致"
          sed -n 's/^::group::\(.*\):$/\1/p' "${logs[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/ran.txt"
          dup=$(uniq -d "$RUNNER_TEMP/ran.txt")
          [ -z "$dup" ] || fail "这些测试文件被不止一片跑了：$dup"
          diff "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/ran.txt" || fail "各片跑过的文件和入库的测试文件对不上（< 没跑到，> 不在入库清单里）"
          echo "${#logs[@]} 片 · $bunv · head $heads · bun 发现 $disc 个 · 实跑 $(grep -c "" "$RUNNER_TEMP/ran.txt") 个测试文件，不漏不重"

  web:
    name: web typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 类型检查和 lint 用不到 sqlite / sharp 这类原生模块的安装脚本；npm install 而非 npm ci 的原因见上面 check 作业
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      # lib/build-info.ts 由构建时生成（不入库），tsc 需要它先存在
      - name: Generate build info
        run: node scripts/gen-build-info.mjs

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit --incremental false

      # warning 数当棘轮用：只许降，降了就把这个数字改小
      - name: Lint (eslint)
        run: npx eslint --max-warnings 38

  # 菜单栏小程序（desktop/）：窗口 TS 的类型检查 + Rust 外壳的 cargo test。跑在 macOS 上，因为 app 只支持 macOS
  # （plutil / launchctl / ActivationPolicy）。在 ubuntu 上跑得先装 webkit2gtk、appindicator，测的却是一个永远不会发布的 Linux 构建。
  desktop:
    name: desktop typecheck + cargo test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # desktop 的 typecheck 用根目录 node_modules 里的 tsc
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck window UI (tsc)
        run: bun run typecheck
        working-directory: desktop

      # tauri::generate_context! 在编译期打包 frontendDist（desktop/dist），没有它 cargo test 连编译都过不了
      - name: Build window UI
        run: bun run build:ui
        working-directory: desktop

      - uses: dtolnay/rust-toolchain@stable

      # 冷编译 tauri 依赖树要十分钟左右，缓存 target/ 之后大约两分钟
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: cargo test
        run: cargo test --locked
        working-directory: desktop/src-tauri
