name: CI

# 在此之前仓库没有任何 CI：315 个测试没人跑，两万余行 src/ 没有静态类型检查
# （CONTRIBUTING 里推荐的 `bun build` 实测并不做类型检查）。2026-07-25 一次
# 方向性错误的改动 test 全绿、build 全过地走到了提交前一刻，只靠人工实测才拦下。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck + test + guard
    runs-on: ubuntu-latest
    steps:
      # guard 要拿推送前的 baseline 比对（放宽必须有 raised[] 记录），需要完整历史
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与线上一致的 Bun 版本：parseDotenv 等测试按 Bun 的真实行为校准，latest 一变 CI 就随机变红
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 根目录 tests/ 会 import web 的纯逻辑，其中几个（BFF 包装器的测试）顺带引用了 next /
      # better-sqlite3 的类型——web 依赖不装，typecheck 和 bun test 都找不到它们。
      # 本地因为 web/node_modules 一直在，所以这个缺口只在 CI 暴露（2026-09-23 首次推送即红）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 用 npm install 而不是 npm ci：用户装网页走的就是 npm install（setup / update），锁文件的排法差异
      # 不影响安装；npm ci 却会因为贡献者本机 npm 版本不同、重排了锁文件而整个作业失败（#29 / #31 实遇，
      # 代码一行没错）。锁文件与本次安装结果不一致时只在下一步给黄色提醒，不判失败。
      - name: Install web dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: web

      - name: Web lockfile drift (warning only)
        run: git diff --quiet -- web/package-lock.json || echo "::warning file=web/package-lock.json::锁文件与 CI 的 npm 装出来的不一致（多半是本地 npm 版本不同重排了它）。不影响安装；要消掉就以 main 的锁文件为底执行 npm install --package-lock-only"

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      # 防腐棘轮（scripts/guard）：超 baseline 即红；baseline 变大、改闸门本身都必须在 raised[] 写理由。
      # 比较基准：PR 取 base.sha，push 取推送前的 before（新分支首推是全 0 / force push 取不到时，
      # guard 回退到与 origin/main 的分叉点，再不行用 HEAD~1）。
      # GUARD_STRICT：CI 是最后一道闸，knip / oxc-parser 缺席导致规则被跳过也算失败（本地才降级）。
      # 这一步和 GUARD_STRICT 由 guard 自己校验（scripts/guard/self.ts），删掉或改名会让 guard 失败。
      - name: Guard (ratchets)
        run: bun run guard
        env:
          GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GUARD_STRICT: "1"

      # 各可执行入口都要能打包 —— 能抓到类型检查覆盖不到的模块解析/导入错误
      - name: Build entrypoints
        run: |
          for entry in bridge channel-server manager launcher cron setup; do
            echo "── building src/$entry.ts"
            bun build "src/$entry.ts" --target=bun --outdir=/tmp/ci-build
          done

  web:
    name: web typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 类型检查和 lint 用不到 sqlite / sharp 这类原生模块的安装脚本；npm install 而非 npm ci 的原因见上面 check 作业
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      # lib/build-info.ts 由构建时生成（不入库），tsc 需要它先存在
      - name: Generate build info
        run: node scripts/gen-build-info.mjs

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit --incremental false

      # warning 数当棘轮用：只许降，降了就把这个数字改小
      - name: Lint (eslint)
        run: npx eslint --max-warnings 38
