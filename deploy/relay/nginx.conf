# Claudestra 中继的 nginx 站点。用法：
#   sed "s/RELAY_BASE/relay.example.com/g" nginx.conf > /etc/nginx/sites-available/claudestra-relay.conf
# 证书必须同时覆盖 RELAY_BASE 与 *.RELAY_BASE（每台实例一个子域名），只能用 DNS-01 签通配符（见 docs/relay/self-host.md）。
# 所有路径都交给中继进程：主机名是 RELAY_BASE 时它出自己的页面，是 <slug>.RELAY_BASE 时走隧道。

server {
    listen 80;
    listen [::]:80;
    server_name RELAY_BASE *.RELAY_BASE;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name RELAY_BASE *.RELAY_BASE;

    ssl_certificate     /etc/nginx/ssl/RELAY_BASE/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/RELAY_BASE/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    # 隧道正文最大就是实例 Web 自己的上限；nginx 这层放宽，别在中间截断上传
    client_max_body_size 64m;

    # 实例的 WebSocket：协议心跳 25 s、判死 75 s，read timeout 放到 1 h 才不会被 nginx 先掐
    location = /v1/ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 页面与隧道（含 SSE 流）：不缓冲、长 read timeout
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
