<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claudestra</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #171819; color: #e8e8ea; font-family: -apple-system, system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
  p { font-size: 15px; line-height: 1.6; opacity: .85; margin: 0; }
  small { display: block; margin-top: 6px; font-size: 12.5px; opacity: .55; word-break: break-all; }
  button { margin: 18px 6px 0; padding: 10px 24px; border-radius: 10px; border: 1px solid #4a4d52;
           background: #2b2d31; color: #fff; font: inherit; font-size: 15px; }
  button.primary { background: #5b6cff; border-color: #5b6cff; }
</style>
</head>
<body>
<div>
  <p>连不上 Claudestra<small id="where">确认网络(如 Tailscale)已开、服务器在线</small></p>
  <button class="primary" id="retry">重试</button>
  <button id="change">更换服务器</button>
</div>
<script>
(function () {
  var P = function () { return (window.Capacitor && window.Capacitor.Plugins) || {}; };
  try { P().SplashScreen && P().SplashScreen.hide(); } catch (e) {}
  var cfg = P().ServerConfig, where = document.getElementById('where');
  var url = '';
  if (cfg) cfg.get().then(function (r) { url = (r && r.url) || ''; if (url) where.textContent = url + ' · 确认网络(如 Tailscale)已开、服务器在线'; }).catch(function () {});
  // 重试 = 让原生重建 WebView 重新加载(比 location.replace 稳:不受导航白名单影响)
  document.getElementById('retry').addEventListener('click', function () {
    if (cfg && url) cfg.set({ url: url }); else location.reload();
  });
  document.getElementById('change').addEventListener('click', function () {
    if (cfg) cfg.clear();
  });
})();
</script>
</body>
</html>
